name: Deploy keycloak

on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: unifit-keycloak
  ECR_REGISTRY: 654784951227.dkr.ecr.us-east-1.amazonaws.com
  KEYCLOAK_VERSION: 26.2.3

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configura credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build da imagem otimizada do Keycloak
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$KEYCLOAK_VERSION -f Dockerfile.keycloak .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$KEYCLOAK_VERSION

      - name: Deploy na EC2 via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters commands='[
              "cd /home/ubuntu/unifit/backend",
              "docker compose pull keycloak",
              "docker compose up -d --force-recreate keycloak"
            ]' \
            --query "Command.CommandId" \
            --output text)

          sleep 15

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
            --output table